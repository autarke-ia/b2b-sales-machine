# /etc/nginx/sites-available/ita-challenge.autarke.ia.br
#
# Reverse proxy do protótipo B2B Sales Machine no nginx DO HOST (mesmo modelo
# dos domínios Autarkeia/Mindville na mesma caixa). O container publica em
# 127.0.0.1:3001 (só localhost) — não colide com os outros (website :8081,
# mindville_web :3000, mindville_website :3080, mindville_api :4000).
#
# Instalação:
#   sudo cp deploy/nginx/ita-challenge.autarke.ia.br.conf \
#           /etc/nginx/sites-available/ita-challenge.autarke.ia.br
#   sudo ln -s /etc/nginx/sites-available/ita-challenge.autarke.ia.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (após o A record propagar):
#   sudo certbot --nginx -d ita-challenge.autarke.ia.br
#   → reescreve este server p/ :443 ssl e cria o redirect 80→443.

server {
    listen 80;
    listen [::]:80;
    server_name ita-challenge.autarke.ia.br;

    # Uploads de CSV: limite de produto é 10 MiB + overhead multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só quando o HTTPS estiver 100% estável (afeta o apex inteiro):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # O app usa TRUSTED_PROXY_DEPTH=1: lê o ÚLTIMO hop do XFF (o que ESTE
        # nginx acrescenta) — prefixos forjados pelo cliente são ignorados.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
