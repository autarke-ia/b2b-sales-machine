name: release-please

# Versionamento + changelog automáticos por Conventional Commits — paridade 1:1 com
# o autarkeia-website (que por sua vez espelha o Mindville): abre/atualiza um PR de
# release; ao mergear, cria a tag vX.Y.Z — que dispara o app-ecr (push de tag v*).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
